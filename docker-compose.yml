services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: syntra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syntra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-owner}
      POSTGRES_DB: ${POSTGRES_DB:-syntra}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Backing store for BullMQ. BullMQ requires maxmemory-policy noeviction.
  redis:
    image: redis:7-alpine
    container_name: syntra-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP sink for development: SMTP on 1025, web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: syntra-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres_data:
  redis_data:
