<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 770" width="1400" height="770" role="img" aria-label="syntra">
  <title>syntra</title>
  <defs>
    <linearGradient id="gLeft" x1="0.35" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#0072FF"/>
    </linearGradient>
    <linearGradient id="gRight" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#00D8FF"/>
      <stop offset="1" stop-color="#0A8CFF"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="770" fill="#FFFFFF"/>

